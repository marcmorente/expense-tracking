schema: spec-driven

context: |
  Tech stack: PHP 8.4, Symfony 8.1, Doctrine ORM 3.x, SQLite, Twig, PHPUnit, Infection
  Frontend tooling: ESLint 9 (flat config), Prettier, Stylelint 17 (standard config), Vitest (jsdom), Husky, lint-staged
  Architecture: layered (Controller -> Service -> Repository -> Entity), enforced by deptrac
  Code style: strict types, PHP-CS-Fixer (@PhpCsFixer), Prettier (2-space indent for JS), 4-space indent (PHP)
  Static analysis: PHPStan level 10 with haspadar rules (immutable services, parameter naming); ESLint (flat config) for JS; Stylelint (standard config) for CSS
  Domain: personal expense tracking
  Testing: PHPUnit with Symfony test framework, Vitest (jsdom) for JS tests, Infection for mutation testing
  Pre-commit: Husky with lint-staged
  Verification: npm run lint, npm run lint:css, and npm test must pass for frontend changes
  Architectural approach: follow martinfowler.com/articles/llm-and-dsls.html — build semantic model and DSL as harness for LLM-generated code

rules:
  proposal:
    - Include rollback plan
  specs:
    - Use Given/When/Then format for scenarios
  design:
    - Include sequence diagrams for complex flows
  tasks:
    - Each task should be completable in < 2 hours
    - Include acceptance criteria
