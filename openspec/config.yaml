schema: spec-driven

context: |
  Read AGENTS.md first. It is the single source of truth for the stack, the layer
  rules, the PHP constraints, the database platform, the test patterns and the
  verification command. Do not duplicate that content here.

  Domain: personal expense tracking.

  Golden path: copy the Expense slice. AGENTS.md lists every file in it.

  Verification: run `composer verify`. It runs every gate for PHP, YAML, Twig,
  the service container, JavaScript and CSS. A change is not done until it passes.

  Architectural approach: follow martinfowler.com/articles/llm-and-dsls.html.
  Build a semantic model and a DSL as a harness for LLM-generated code. The
  haspadar ruleset already forces part of this: constructors only assign
  properties, so invariants belong in types and in the Service layer.

rules:
  proposal:
    - Include rollback plan
  specs:
    - Use Given/When/Then format for scenarios
  design:
    - Include sequence diagrams for complex flows
  tasks:
    - Each task should be completable in < 2 hours
    - Include acceptance criteria
